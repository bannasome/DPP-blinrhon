<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Profile Card</title>
    <link rel="stylesheet" href="card.css">
</head>
<body>

    <div class="card">
        <!-- 1. Header บนสุดของการ์ด -->
        <div class="card-header">
            <h2>User Profile Card</h2>
        </div>

        <!-- 2. Invisible Table จัดระเบียบข้อมูล -->
        <table class="profile-table">
            <tr>
                <td>
                    <!-- 3. รูปโปรไฟล์ -->
                    <img src="https://hstd1.s3.kmitl.ac.th/kmitl-ifolio/students/cmsnztgq700e7qp18i471eb6h/avatar.png" alt="Profile Picture" class="profile-img">
                </td>
            </tr>
            <tr>
                <td>
                    <!-- 4. Login Name -->
                    <h3 class="login-name">blinrhon</h3>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- 5. คำอธิบาย 2-3 คำ -->
                    <p class="description">Student</p>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- 6. ไอคอน Social Media เรียงต่อกัน -->
                    <div class="social-icons">
                        <a href="#"><img src="https://cdn-icons-png.flaticon.com/512/2168/2168281.png" alt="Social 1"></a>
                        <a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT1r_n7Ncf4XIYY446StzJVq6O04jNfstNuTGNLSmvedQ&s=10" alt="Social 2"></a>
                        <a href="#"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTPxD_y294_LXlRRp_feu5F47Mt5-4RYLKruJ--V-xSew&s=10" alt="Social 3"></a>
                    </div>
                </td>
            </tr>
            <tr>
                <td>
                    <!-- 7. ปุ่ม Contact ด้านล่างสุด -->
                    <button class="contact-btn">Contact</button>
                </td>
            </tr>
        </table>
    </div>

</body>
</html>

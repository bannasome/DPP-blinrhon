<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax Effect</title>
    <link rel="stylesheet" href="parallax.css">
</head>
<body>

    <!-- ส่วนที่ 1: รูปภาพแรก + ข้อความตรงกลาง -->
    <div class="parallax img1">
        <div class="caption">
            <span class="border">cell 1-0 </span>
        </div>
    </div>

    <!-- ส่วนที่ 2: บล็อกสีดำ + ข้อความ -->
    <div class="black-block">
        <h3>After continuing to work...</h3>
        <p>It made me realize that...</p>
    </div>

    <!-- ส่วนที่ 3: รูปภาพที่สอง + ข้อความตรงกลาง -->
    <div class="parallax img2">
        <div class="caption">
            <span class="border">cell 1-4 ++</span>
        </div>
    </div>

</body>
</html>
